# Génère la documentation (docfx) du SDK et la publie sur GitHub Pages.
name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: GlpiNg.Plugins.Sdk

      # Documenté avec le SDK, et référencé en ../GlpiNg.Modules.Abstractions par son .csproj :
      # même disposition que dans le dépôt GlpiNg (src/).
      - uses: actions/checkout@v7
        with:
          repository: GlpiNg-fr/GlpiNg.Modules.Abstractions
          path: GlpiNg.Modules.Abstractions

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet tool update -g docfx

      - run: docfx GlpiNg.Plugins.Sdk/docs/docfx.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: GlpiNg.Plugins.Sdk/docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
